<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineMatch | Descubrí tu próxima historia</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="logo">🎬 Cine<span>Match</span></div><div id="account"></div></header><main><section class="hero"><p class="eyebrow">TU PRÓXIMA HISTORIA EMPIEZA ACÁ</p><h1>Encontrá algo que <em>te encante.</em></h1><p>Películas, series y recomendaciones según tus gustos.</p></section><section id="auth" class="panel"><div class="tabs"><button id="loginTab" class="active">Ingresar</button><button id="registerTab">Registrarme</button></div><form id="authForm"><div id="registerFields" hidden><input id="name" placeholder="Tu nombre"><input id="age" type="number" min="1" max="120" placeholder="Tu edad" value="18"><label>Géneros preferidos</label><select id="genres" multiple><option>Acción</option><option>Comedia</option><option>Drama</option><option>Misterio</option><option>Ciencia ficción</option><option>Aventura</option><option>Documental</option><option>Música</option><option>Suspenso</option></select><small>Usá Ctrl para seleccionar varios</small></div><input id="email" type="email" required placeholder="Correo electrónico"><input id="password" type="password" minlength="8" required placeholder="Contraseña (mínimo 8 caracteres)"><button class="primary" type="submit">Continuar</button></form></section><section id="dashboard" hidden><div class="toolbar"><h2>Explorá el catálogo</h2><input id="search" placeholder="Buscar película o serie..."></div><div id="catalog" class="grid"></div><h2>Recomendaciones para vos</h2><div id="recommendations" class="grid"></div><h2>Mis calificaciones e historial</h2><div id="activity"></div></section><p id="message" role="status"></p></main><footer>Proyecto educativo · Generación T · CineMatch</footer><script src="/app.js"></script></body></html>
